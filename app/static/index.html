<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduling Assistant</title>
<style>
  /* Minimalist, cal.com-inspired: near-black on white, quiet gray borders */
  :root {
    --bg: #f9fafb;
    --surface: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --accent: #111827;
    --border: #e5e7eb;
    --sans: -apple-system, "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 0;
  }
  header span {
    color: var(--muted);
    font-size: 11.5px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
  }
  .msg ul { margin: 4px 0; padding-left: 20px; white-space: normal; }
  .msg li { margin: 2px 0; }
  .msg code {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 4px;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .assistant {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .tools {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    padding: 0 6px;
  }
  .tools .ok::before { content: "✓ "; color: var(--accent); }
  .tools .err::before { content: "✗ "; color: var(--accent); }
  .tools .pend::before { content: "… "; }
  .confirm-card {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    padding: 14px 16px;
    max-width: 78%;
    font-size: 14px;
  }
  .confirm-card .summary { margin-bottom: 6px; font-weight: 600; }
  .confirm-card .details {
    white-space: pre-line;
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 10px;
  }
  .confirm-card .details a {
    color: var(--ink);
    text-decoration: underline;
    word-break: break-all;
  }
  .confirm-card .actions { display: flex; gap: 8px; }
  .confirm-card button { padding: 8px 16px; font-size: 14px; }
  .confirm-card button.decline {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .confirm-card.resolved { opacity: 0.55; }
  details.thinking {
    align-self: flex-start;
    max-width: 78%;
    font-size: 12.5px;
    color: var(--muted);
    border-left: 2px solid var(--border);
    padding: 2px 10px;
  }
  details.thinking summary {
    cursor: pointer;
    font-style: italic;
    user-select: none;
  }
  details.thinking .body {
    white-space: pre-wrap;
    word-wrap: break-word;
    margin-top: 4px;
    max-height: 180px;
    overflow-y: auto;
  }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 14px;
    padding: 4px 6px;
  }
  .typing::after {
    content: "…";
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px 22px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  form .inner {
    display: flex;
    gap: 10px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: var(--surface);
  }
  input[type="text"]:focus { border-color: var(--ink); }
  button {
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover:not(:disabled) { opacity: 0.88; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Scheduling Assistant</h1>
  <span>your cal.com calendar, by chat</span>
</header>

<div id="messages" role="log" aria-live="polite"></div>

<form id="chat-form">
  <div class="inner">
    <input id="input" type="text" autocomplete="off"
           aria-label="Message the scheduling assistant"
           placeholder='Try: "What&#39;s on my calendar?"' autofocus>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("chat-form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
// crypto.randomUUID only exists in secure contexts (https / localhost)
const sessionId = crypto.randomUUID ? crypto.randomUUID()
  : `${Date.now().toString(16)}-${Math.random().toString(16).slice(2)}`;

// Minimal markdown for assistant replies (bold, inline code, "- " lists).
// Built entirely with DOM nodes — model/user text never reaches innerHTML.
function renderInline(parent, text) {
  const re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    const token = m[0];
    const el = document.createElement(token.startsWith("**") ? "strong" : "code");
    el.textContent = token.startsWith("**") ? token.slice(2, -2) : token.slice(1, -1);
    parent.appendChild(el);
    last = m.index + token.length;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}

function renderRichText(container, text) {
  let list = null;
  text.split("\n").forEach((line, i) => {
    const item = line.match(/^\s*[-*•]\s+(.*)$/);
    if (item) {
      if (!list) { list = document.createElement("ul"); container.appendChild(list); }
      const li = document.createElement("li");
      renderInline(li, item[1]);
      list.appendChild(li);
    } else {
      // No newline node right after a </ul> — the block break is implicit
      const afterList = list !== null;
      list = null;
      if (i > 0 && !afterList) container.appendChild(document.createTextNode("\n"));
      const heading = line.match(/^#{1,4}\s+(.*)$/);
      if (heading) {
        const strong = document.createElement("strong");
        renderInline(strong, heading[1]);
        container.appendChild(strong);
      } else {
        renderInline(container, line);
      }
    }
  });
}

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role === "assistant") {
    renderRichText(el, text);
  } else {
    el.textContent = text;
  }
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

const TOOL_LABELS = {
  list_bookings: "checked your calendar",
  list_event_types: "looked up event types",
  get_available_slots: "checked availability",
  create_booking: "created a booking",
  cancel_booking: "cancelled a booking",
  reschedule_booking: "rescheduled a booking",
};

const PENDING_LABELS = {
  cancel_booking: "cancellation ready to confirm",
  reschedule_booking: "reschedule ready to confirm",
};

function addToolActivity(activity) {
  if (!activity || activity.length === 0) return;
  const el = document.createElement("div");
  el.className = "tools";
  activity.forEach((a, i) => {
    if (i > 0) el.appendChild(document.createTextNode(" · "));
    const span = document.createElement("span");
    span.className = a.ok ? "ok" : "err";
    span.textContent = TOOL_LABELS[a.name] || a.name;
    el.appendChild(span);
  });
  messagesEl.appendChild(el);
}

// Text + clickable http(s) links, built as DOM nodes (no innerHTML; the
// scheme-anchored regex rules out javascript: and friends).
function appendLinkified(parent, text) {
  const re = /https?:\/\/[^\s]+/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement("a");
    a.href = m[0];
    a.textContent = m[0];
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    parent.appendChild(a);
    last = m.index + m[0].length;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}

let activeCard = null;  // at most one live confirmation card

function retireActiveCard() {
  if (!activeCard) return;
  activeCard.querySelectorAll("button").forEach(b => b.disabled = true);
  activeCard.classList.add("resolved");
  activeCard = null;
}

function addPendingCard(pending) {
  // The same unresolved action re-announced after a follow-up message:
  // move the live card to the bottom instead of duplicating it.
  if (activeCard && activeCard.dataset.actionId === pending.id) {
    messagesEl.appendChild(activeCard);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return;
  }
  retireActiveCard();  // a *different* action replaces the old card
  const card = document.createElement("div");
  card.className = "confirm-card";
  card.dataset.actionId = pending.id;
  // First line is the headline; any further lines are booking details
  const [headline, ...detailLines] = pending.summary.split("\n");
  const summary = document.createElement("div");
  summary.className = "summary";
  summary.textContent = headline;
  const actions = document.createElement("div");
  actions.className = "actions";
  const confirmBtn = document.createElement("button");
  confirmBtn.textContent = "Confirm";
  const declineBtn = document.createElement("button");
  declineBtn.textContent = "Decline";
  declineBtn.className = "decline";
  actions.append(confirmBtn, declineBtn);
  card.append(summary);
  if (detailLines.length) {
    const details = document.createElement("div");
    details.className = "details";
    detailLines.forEach((line, i) => {
      if (i > 0) details.appendChild(document.createTextNode("\n"));
      appendLinkified(details, line);
    });
    card.append(details);
  }
  card.append(actions);
  messagesEl.appendChild(card);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  activeCard = card;

  const decide = (approved) => () => {
    retireActiveCard();
    postAndRender("/api/chat/confirm",
      { session_id: sessionId, action_id: pending.id, approved });
  };
  confirmBtn.addEventListener("click", decide(true));
  declineBtn.addEventListener("click", decide(false));
}

function handleReply(data) {
  addToolActivity(data.tool_activity);
  addMessage("assistant", data.reply);
  if (data.pending_action) addPendingCard(data.pending_action);
}

// Plain POST → render path (used by /api/chat/confirm, which returns JSON)
async function postAndRender(url, payload) {
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const detail = (await res.json().catch(() => ({}))).detail;
      addMessage("assistant", detail || "Sorry, something went wrong. Please try again.");
      return;
    }
    handleReply(await res.json());
  } catch {
    addMessage("assistant", "I couldn't reach the server — is it still running?");
  }
}

// Streaming POST for /api/chat: consumes SSE frames and renders them live.
async function streamChat(payload, onFirstEvent) {
  const live = {
    thinking: null,
    tools: null,
    reply: null, replyText: "", needsBreak: false,
  };

  const scroll = () => { messagesEl.scrollTop = messagesEl.scrollHeight; };

  // Shared end-of-turn cleanup: collapse the reasoning, swap raw streamed
  // text for the markdown rendering. Used by both `done` and `error`.
  const finalizeLive = () => {
    if (live.thinking) live.thinking.open = false;
    if (live.reply) {
      live.reply.replaceChildren();
      renderRichText(live.reply, live.replyText);
    }
  };

  const handlers = {
    thinking(data) {
      if (!live.thinking) {
        live.thinking = document.createElement("details");
        live.thinking.className = "thinking";
        live.thinking.open = true;
        const summary = document.createElement("summary");
        summary.textContent = "thinking";
        summary.setAttribute("aria-label", "Model reasoning (collapsible)");
        const body = document.createElement("div");
        body.className = "body";
        live.thinking.append(summary, body);
        messagesEl.appendChild(live.thinking);
      }
      const body = live.thinking.querySelector(".body");
      body.textContent += data.delta;
      body.scrollTop = body.scrollHeight;
      scroll();
    },
    tool(data) {
      if (!live.tools) {
        live.tools = document.createElement("div");
        live.tools.className = "tools";
        messagesEl.appendChild(live.tools);
      }
      if (live.tools.childNodes.length) {
        live.tools.appendChild(document.createTextNode(" · "));
      }
      const span = document.createElement("span");
      if (data.pending) {
        span.className = "pend";
        span.textContent = PENDING_LABELS[data.name] || `${data.name} ready to confirm`;
      } else {
        span.className = data.ok ? "ok" : "err";
        span.textContent = TOOL_LABELS[data.name] || data.name;
      }
      live.tools.appendChild(span);
      live.needsBreak = true;  // text after tools starts a new paragraph
      scroll();
    },
    text(data) {
      if (!live.reply) {
        live.reply = document.createElement("div");
        live.reply.className = "msg assistant";
        messagesEl.appendChild(live.reply);
      }
      if (live.needsBreak && live.replyText) live.replyText += "\n\n";
      live.needsBreak = false;
      live.replyText += data.delta;
      live.reply.textContent = live.replyText;
      scroll();
    },
    done(data) {
      if (!live.reply) {
        live.reply = document.createElement("div");
        live.reply.className = "msg assistant";
        messagesEl.appendChild(live.reply);
      }
      if (!live.replyText) live.replyText = data.reply;  // provider didn't stream
      finalizeLive();
      if (data.pending_action) addPendingCard(data.pending_action);
      scroll();
    },
    error(data) {
      finalizeLive();  // don't leave a half-rendered turn above the error
      addMessage("assistant", data.detail || "Sorry, something went wrong. Please try again.");
    },
  };

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      onFirstEvent();
      const detail = (await res.json().catch(() => ({}))).detail;
      addMessage("assistant", detail || "Sorry, something went wrong. Please try again.");
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", sawEvent = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let end;
      while ((end = buffer.indexOf("\n\n")) !== -1) {
        const frame = buffer.slice(0, end);
        buffer = buffer.slice(end + 2);
        if (!sawEvent) { sawEvent = true; onFirstEvent(); }
        // One bad frame (or a handler bug) must not kill the whole stream
        try {
          let event = "", data = {};
          for (const line of frame.split("\n")) {
            if (line.startsWith("event: ")) event = line.slice(7);
            else if (line.startsWith("data: ")) data = JSON.parse(line.slice(6));
          }
          if (handlers[event]) handlers[event](data);
        } catch (err) {
          console.warn("Skipping malformed stream frame:", err);
        }
      }
    }
  } catch {
    onFirstEvent();
    addMessage("assistant", "I couldn't reach the server — is it still running?");
  }
}

addMessage("assistant",
  "Hi! I can manage your cal.com calendar — ask me to book something, " +
  "see what's coming up, or move and cancel events.");

let inFlight = false;  // Enter can submit even while the button is disabled

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || inFlight) return;

  inFlight = true;
  // NB: the pending card (if any) stays live — confirmations survive follow-up chat
  addMessage("user", text);
  input.value = "";
  input.disabled = true;  // no silent drops: you can't type into an in-flight turn
  sendBtn.disabled = true;

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "thinking";
  messagesEl.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    // The indicator only bridges the gap until the first streamed event
    await streamChat({ session_id: sessionId, message: text }, () => typing.remove());
  } finally {
    typing.remove();
    inFlight = false;
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
