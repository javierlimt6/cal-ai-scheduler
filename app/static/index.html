<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduling Assistant</title>
<style>
  :root {
    --bg: #f6f3ec;
    --surface: #ffffff;
    --ink: #25221c;
    --muted: #8a8478;
    --accent: #c2542e;
    --accent-soft: #f6e3da;
    --border: #e5dfd2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    margin: 0;
  }
  header span { color: var(--muted); font-size: 13px; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
  }
  .user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .assistant {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .tools {
    align-self: flex-start;
    font-size: 12px;
    color: var(--muted);
    padding: 0 6px;
  }
  .tools .ok::before { content: "✓ "; color: #4d7c4d; }
  .tools .err::before { content: "✗ "; color: var(--accent); }
  .confirm-card {
    align-self: flex-start;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 14px 16px;
    max-width: 78%;
    font-size: 14px;
  }
  .confirm-card .summary { margin-bottom: 10px; font-weight: 600; }
  .confirm-card .actions { display: flex; gap: 8px; }
  .confirm-card button { padding: 8px 16px; font-size: 14px; }
  .confirm-card button.decline {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .confirm-card.resolved { opacity: 0.55; }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 14px;
    padding: 4px 6px;
  }
  .typing::after {
    content: "…";
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px 22px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  form .inner {
    display: flex;
    gap: 10px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    background: var(--bg);
  }
  input[type="text"]:focus { border-color: var(--accent); background: #fff; }
  button {
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Scheduling Assistant</h1>
  <span>your cal.com calendar, by chat</span>
</header>

<div id="messages"></div>

<form id="chat-form">
  <div class="inner">
    <input id="input" type="text" autocomplete="off"
           placeholder='Try: "What&#39;s on my calendar?"' autofocus>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("chat-form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const sessionId = crypto.randomUUID();

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

function addToolActivity(activity) {
  if (!activity || activity.length === 0) return;
  const el = document.createElement("div");
  el.className = "tools";
  el.innerHTML = activity
    .map(a => `<span class="${a.ok ? "ok" : "err"}">${a.name}</span>`)
    .join(" · ");
  messagesEl.appendChild(el);
}

let activeCard = null;  // at most one live confirmation card

function retireActiveCard() {
  if (!activeCard) return;
  activeCard.querySelectorAll("button").forEach(b => b.disabled = true);
  activeCard.classList.add("resolved");
  activeCard = null;
}

function addPendingCard(pending) {
  retireActiveCard();
  const card = document.createElement("div");
  card.className = "confirm-card";
  const summary = document.createElement("div");
  summary.className = "summary";
  summary.textContent = pending.summary;
  const actions = document.createElement("div");
  actions.className = "actions";
  const confirmBtn = document.createElement("button");
  confirmBtn.textContent = "Confirm";
  const declineBtn = document.createElement("button");
  declineBtn.textContent = "Decline";
  declineBtn.className = "decline";
  actions.append(confirmBtn, declineBtn);
  card.append(summary, actions);
  messagesEl.appendChild(card);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  activeCard = card;

  const decide = (approved) => async () => {
    retireActiveCard();
    try {
      const res = await fetch("/api/chat/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, action_id: pending.id, approved }),
      });
      if (!res.ok) {
        const detail = (await res.json().catch(() => ({}))).detail;
        addMessage("assistant", detail || "Sorry, something went wrong. Please try again.");
        return;
      }
      handleReply(await res.json());
    } catch {
      addMessage("assistant", "I couldn't reach the server — is it still running?");
    }
  };
  confirmBtn.addEventListener("click", decide(true));
  declineBtn.addEventListener("click", decide(false));
}

function handleReply(data) {
  addToolActivity(data.tool_activity);
  addMessage("assistant", data.reply);
  if (data.pending_action) addPendingCard(data.pending_action);
}

addMessage("assistant",
  "Hi! I can manage your cal.com calendar — ask me to book something, " +
  "see what's coming up, or move and cancel events.");

let inFlight = false;  // Enter can submit even while the button is disabled

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || inFlight) return;

  inFlight = true;
  retireActiveCard();  // typing a new message moves on; the server drops the pending action
  addMessage("user", text);
  input.value = "";
  sendBtn.disabled = true;

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "thinking";
  messagesEl.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    typing.remove();
    if (!res.ok) {
      const detail = (await res.json().catch(() => ({}))).detail;
      addMessage("assistant", detail || "Sorry, something went wrong. Please try again.");
      return;
    }
    handleReply(await res.json());
  } catch {
    typing.remove();
    addMessage("assistant", "I couldn't reach the server — is it still running?");
  } finally {
    inFlight = false;
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
